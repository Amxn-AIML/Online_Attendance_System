<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Absent Students Report</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:"Segoe UI",sans-serif;
}

body{
  background:linear-gradient(135deg,#eef2ff,#f8fafc);
  padding:30px;
}

#page-loader{
  position:fixed;
  width:100%;
  height:100vh;
  background:#0f172a;
  display:flex;
  justify-content:center;
  align-items:center;
  z-index:99999;
  top:0;
  left:0;
}

.loader-animation{
  width:65px;
  aspect-ratio:1;
  position:relative;
}

.loader-animation:before,
.loader-animation:after{
  content:"";
  position:absolute;
  border-radius:50px;
  box-shadow:0 0 0 3px inset #fff;
  animation:l4 2.5s infinite;
}

.loader-animation:after{
  animation-delay:-1.25s;
}

@keyframes l4{
  0%{inset:0 35px 35px 0;}
  12.5%{inset:0 35px 0 0;}
  25%{inset:35px 35px 0 0;}
  37.5%{inset:35px 0 0 0;}
  50%{inset:35px 0 0 35px;}
  62.5%{inset:0 0 0 35px;}
  75%{inset:0 0 35px 35px;}
  87.5%{inset:0 0 35px 0;}
  100%{inset:0 35px 35px 0;}
}

#main-content{
  display:none;
}

.header{
  background:white;
  padding:22px 26px;
  border-radius:18px;
  box-shadow:0 12px 35px rgba(0,0,0,.08);
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:30px;
  gap:15px;
  flex-wrap:wrap;
}

.header h2{
  color:#1f2937;
  font-size:22px;
}

.actions{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

.btn{
  padding:10px 18px;
  border-radius:10px;
  text-decoration:none;
  font-weight:600;
  font-size:14px;
  display:inline-block;
  text-align:center;
  border:none;
  cursor:pointer;
}

.btn-back{
  background:#4f46e5;
  color:white;
}

.btn-print{
  background:#16a34a;
  color:white;
}

.table-box{
  background:white;
  border-radius:20px;
  box-shadow:0 16px 45px rgba(0,0,0,.08);
  overflow-x:auto;
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:700px;
}

table th,
table td{
  padding:14px;
  border-bottom:1px solid #e5e7eb;
  font-size:14px;
  text-align:left;
  white-space:nowrap;
}

table th{
  background:#eef2ff;
  color:#3730a3;
}

.absent{
  color:#dc2626;
  font-weight:700;
}

.empty{
  text-align:center;
  padding:30px;
  color:#16a34a;
  font-size:15px;
  font-weight:600;
}

@media(max-width:768px){
  body{
    padding:15px;
  }

  .header{
    flex-direction:column;
    align-items:flex-start;
  }

  .actions{
    width:100%;
  }

  .btn{
    flex:1 1 100%;
  }
}

@media print{
  body{
    background:white;
    padding:0;
  }

  .actions{
    display:none;
  }

  .header{
    box-shadow:none;
    border:1px solid #ddd;
    margin-bottom:15px;
  }

  .table-box{
    box-shadow:none;
    border:1px solid #ddd;
  }

  table{
    min-width:100%;
  }
}
</style>
</head>

<body>

<div id="page-loader">
  <div class="loader-animation"></div>
</div>

<div id="main-content">

<div class="header">
  <h2>Today Absent Students Report</h2>

  <div class="actions">

    <a href="/admin-dashboard/"
       class="btn btn-back"
       onclick="showLoader()">
      Back to Dashboard
    </a>

    <button onclick="window.print()"
            class="btn btn-print">
      Print / Save PDF
    </button>

  </div>
</div>

<div class="table-box">
  <table>

    <tr>
      <th>Student Name</th>
      <th>Roll Number</th>
      <th>Email</th>
      <th>Status</th>
    </tr>

    {% if students %}
      {% for s in students %}
      <tr>
        <td>{{ s.name }}</td>
        <td>{{ s.roll }}</td>
        <td>{{ s.email }}</td>
        <td class="absent">Absent</td>
      </tr>
      {% endfor %}
    {% else %}
      <tr>
        <td colspan="4" class="empty">
          All students are present today
        </td>
      </tr>
    {% endif %}

  </table>
</div>

</div>

<script>

window.addEventListener("load",()=>{

  setTimeout(()=>{

    pageLoader.style.display="none";
    mainContent.style.display="block";

  },1000);

});

const pageLoader=document.getElementById("page-loader");
const mainContent=document.getElementById("main-content");

function showLoader(){
  pageLoader.style.display="flex";
}

</script>

</body>
</html>
