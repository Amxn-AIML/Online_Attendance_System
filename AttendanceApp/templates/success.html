<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Attendance Status</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#11998e,#38ef7d);
    font-family:Segoe UI, sans-serif;
    padding:15px;
}

#page-loader{
    position:fixed;
    width:100%;
    height:100vh;
    background:#0f172a;
    display:flex;
    justify-content:center;
    align-items:center;
    z-index:99999;
    top:0;
    left:0;
}

.loader-animation {
    width: 65px;
    aspect-ratio: 1;
    position: relative;
}

.loader-animation:before,
.loader-animation:after {
    content: "";
    position: absolute;
    border-radius: 50px;
    box-shadow: 0 0 0 3px inset #fff;
    animation: l4 2.5s infinite;
}

.loader-animation:after {
    animation-delay: -1.25s;
}

@keyframes l4 {
    0% {
        inset: 0 35px 35px 0;
    }
    12.5% {
        inset: 0 35px 0 0;
    }
    25% {
        inset: 35px 35px 0 0;
    }
    37.5% {
        inset: 35px 0 0 0;
    }
    50% {
        inset: 35px 0 0 35px;
    }
    62.5% {
        inset: 0 0 0 35px;
    }
    75% {
        inset: 0 0 35px 35px;
    }
    87.5% {
        inset: 0 0 35px 0;
    }
    100% {
        inset: 0 35px 35px 0;
    }
}

#main-content{
    display:none;
    width:100%;
    display:flex;
    justify-content:center;
    align-items:center;
}

.card{
    background:#fff;
    width:100%;
    max-width:380px;
    padding:30px;
    border-radius:18px;
    box-shadow:0 20px 40px rgba(0,0,0,0.3);
    text-align:center;
}

.icon{
    font-size:60px;
    margin-bottom:15px;
}

.success{
    color:#28a745;
}

.fail{
    color:#dc3545;
}

h2{
    margin-bottom:10px;
}

p{
    font-size:15px;
    color:#555;
}

button{
    margin-top:20px;
    padding:12px 20px;
    border:none;
    border-radius:8px;
    background:#11998e;
    color:#fff;
    font-size:16px;
    cursor:pointer;
    width:100%;
}

@media(max-width:480px){
    .card{
        padding:22px;
    }
    .icon{
        font-size:50px;
    }
}
</style>
</head>

<body>

<div id="page-loader">
    <div class="loader-animation"></div>
</div>

<div id="main-content">

<div class="card">
    <div class="icon success">✔</div>
    <h2>Attendance Submitted</h2>
    <p>Your attendance has been processed.<br>
       You may close this page.</p>

    <button onclick="closePage()">Close</button>
</div>

</div>

<script>

window.addEventListener("load",function(){

    setTimeout(function(){

        document.getElementById("page-loader").style.display="none";
        document.getElementById("main-content").style.display="flex";

    },3000);

});

function closePage(){
    if(window.opener){
        window.close();
    }else{
        window.location.href="/";
    }
}

</script>

</body>
</html>
