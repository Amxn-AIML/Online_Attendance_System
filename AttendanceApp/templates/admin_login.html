<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:"Segoe UI", sans-serif;
}

body{
  min-height:100vh;
  background:linear-gradient(135deg,#4f46e5,#9333ea);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:12px;
}

#page-loader{
  position:fixed;
  width:100%;
  height:100vh;
  background:#0f172a;
  display:flex;
  justify-content:center;
  align-items:center;
  z-index:99999;
  top:0;
  left:0;
}

.loader-animation{
  width:65px;
  aspect-ratio:1;
  position:relative;
}

.loader-animation:before,
.loader-animation:after{
  content:"";
  position:absolute;
  border-radius:50px;
  box-shadow:0 0 0 3px inset #fff;
  animation:l4 2.5s infinite;
}

.loader-animation:after{
  animation-delay:-1.25s;
}

@keyframes l4{
  0%{
    inset:0 35px 35px 0;
  }
  12.5%{
    inset:0 35px 0 0;
  }
  25%{
    inset:35px 35px 0 0;
  }
  37.5%{
    inset:35px 0 0 0;
  }
  50%{
    inset:35px 0 0 35px;
  }
  62.5%{
    inset:0 0 0 35px;
  }
  75%{
    inset:0 0 35px 35px;
  }
  87.5%{
    inset:0 0 35px 0;
  }
  100%{
    inset:0 35px 35px 0;
  }
}

#main-content{
  display:none;
  width:100%;
  min-height:100vh;
  justify-content:center;
  align-items:center;
}

.login-card{
  background:#fff;
  width:100%;
  max-width:380px;
  padding:35px 30px;
  border-radius:18px;
  box-shadow:0 30px 60px rgba(0,0,0,.25);
  text-align:center;
  animation:fadeIn .8s ease;
}

@keyframes fadeIn{
  from{
    opacity:0;
    transform:translateY(20px)
  }
  to{
    opacity:1;
    transform:translateY(0)
  }
}

.login-card h2{
  color:#1f2937;
  margin-bottom:6px;
}

.login-card p{
  color:#6b7280;
  font-size:14px;
  margin-bottom:25px;
}

.input-group{
  text-align:left;
  margin-bottom:18px;
}

.input-group label{
  font-size:13px;
  color:#374151;
  margin-bottom:6px;
  display:block;
}

.input-group input{
  width:100%;
  padding:12px;
  border-radius:10px;
  border:1.8px solid #d1d5db;
  font-size:16px;
  transition:.3s;
}

.input-group input:focus{
  outline:none;
  border-color:#4f46e5;
}

button{
  width:100%;
  padding:13px;
  margin-top:10px;
  border:none;
  border-radius:12px;
  background:linear-gradient(135deg,#4f46e5,#6366f1);
  color:white;
  font-size:16px;
  font-weight:600;
  cursor:pointer;
  transition:.3s;
}

button:hover{
  transform:translateY(-2px);
  box-shadow:0 12px 30px rgba(79,70,229,.45);
}

.back-link{
  margin-top:18px;
  text-align:center;
}

.back-link a{
  font-size:14px;
  color:#4f46e5;
  text-decoration:none;
  font-weight:500;
  transition:.3s;
}

.back-link a:hover{
  text-decoration:underline;
}

.error{
  margin-top:15px;
  color:#dc2626;
  font-size:14px;
}

.footer{
  margin-top:25px;
  font-size:12px;
  color:#9ca3af;
}

@media (max-width:480px){
  .login-card{
    padding:25px 20px;
  }

  .login-card h2{
    font-size:20px;
  }

  .login-card p{
    font-size:13px;
  }
}
</style>
</head>

<body>

<div id="page-loader">
  <div class="loader-animation"></div>
</div>

<div id="main-content">

<div class="login-card">

  <h2>Admin Login</h2>

  <p>Login using superuser credentials</p>

  <form method="POST" onsubmit="showLoader()">

    {% csrf_token %}

    <div class="input-group">
      <label>Username</label>

      <input type="text"
             name="username"
             placeholder="Enter admin username"
             required>
    </div>

    <div class="input-group">
      <label>Password</label>

      <input type="password"
             name="password"
             placeholder="Enter password"
             required>
    </div>

    <button type="submit">
      Login
    </button>

    <div class="back-link">
      <a href="{% url 'login' %}" onclick="showLoader()">
        ← Back to Student Login
      </a>
    </div>

    {% if error %}
      <div class="error">{{ error }}</div>
    {% endif %}

  </form>

  <div class="footer">
    Secure Admin Access Only
  </div>

</div>

</div>

<script>

window.addEventListener("load",function(){

  setTimeout(function(){

    document.getElementById("page-loader").style.display="none";
    document.getElementById("main-content").style.display="flex";

  },2000);

});

function showLoader(){
  document.getElementById("page-loader").style.display="flex";
}

</script>

</body>
</html>
