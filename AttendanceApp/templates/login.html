<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login Page</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    min-height:100vh;
    background:linear-gradient(135deg,#667eea,#764ba2);
    display:flex;
    justify-content:center;
    align-items:center;
    padding:10px;
}

#page-loader{
    position:fixed;
    width:100%;
    height:100vh;
    background:#0f172a;
    display:flex;
    justify-content:center;
    align-items:center;
    z-index:99999;
    top:0;
    left:0;
}

.loader-animation{
    width:65px;
    aspect-ratio:1;
    position:relative;
}

.loader-animation:before,
.loader-animation:after{
    content:"";
    position:absolute;
    border-radius:50px;
    box-shadow:0 0 0 3px inset #fff;
    animation:l4 2.5s infinite;
}

.loader-animation:after{
    animation-delay:-1.25s;
}

@keyframes l4{
    0%{
        inset:0 35px 35px 0;
    }
    12.5%{
        inset:0 35px 0 0;
    }
    25%{
        inset:35px 35px 0 0;
    }
    37.5%{
        inset:35px 0 0 0;
    }
    50%{
        inset:35px 0 0 35px;
    }
    62.5%{
        inset:0 0 0 35px;
    }
    75%{
        inset:0 0 35px 35px;
    }
    87.5%{
        inset:0 0 35px 0;
    }
    100%{
        inset:0 35px 35px 0;
    }
}

#main-content{
    display:none;
    width:100%;
    min-height:100vh;
    justify-content:center;
    align-items:center;
}

.container{
    width:100%;
    max-width:400px;
    padding:20px;
}

.login-box{
    background:rgba(255,255,255,0.15);
    backdrop-filter:blur(10px);
    border-radius:18px;
    padding:40px;
    color:#fff;
    box-shadow:0 8px 32px rgba(0,0,0,0.25);
    animation:fadeIn .8s ease;
}

@keyframes fadeIn{
    from{
        opacity:0;
        transform:translateY(20px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

.login-box h2{
    text-align:center;
    margin-bottom:10px;
}

.subtitle{
    text-align:center;
    font-size:14px;
    margin-bottom:30px;
    opacity:0.8;
}

.input-box{
    position:relative;
    margin-bottom:25px;
}

.input-box input{
    width:100%;
    padding:10px;
    background:transparent;
    border:none;
    border-bottom:2px solid #fff;
    color:#fff;
    font-size:16px;
    outline:none;
}

.input-box label{
    position:absolute;
    top:50%;
    left:0;
    transform:translateY(-50%);
    pointer-events:none;
    transition:0.3s;
    opacity:0.7;
}

.input-box input:focus ~ label,
.input-box input:valid ~ label{
    top:-5px;
    font-size:12px;
    opacity:1;
}

.options{
    display:flex;
    justify-content:space-between;
    font-size:13px;
    margin-bottom:20px;
}

button{
    width:100%;
    padding:12px;
    border:none;
    border-radius:25px;
    background:#fff;
    color:#764ba2;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    transition:0.3s;
    margin-bottom:15px;
}

button:hover{
    background:#f1f1f1;
    transform:translateY(-2px);
}

.google-btn{
    width:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    padding:12px;
    border-radius:25px;
    background:white;
    color:#111;
    text-decoration:none;
    font-weight:600;
    transition:0.3s;
    margin-bottom:20px;
}

.google-btn:hover{
    transform:translateY(-2px);
    background:#f5f5f5;
}

.google-icon{
    width:20px;
    height:20px;
    border-radius:50%;
    background:white;
}

.divider{
    text-align:center;
    margin:18px 0;
    position:relative;
    font-size:13px;
    opacity:0.8;
}

.divider::before{
    content:"";
    position:absolute;
    left:0;
    top:50%;
    width:40%;
    height:1px;
    background:rgba(255,255,255,0.4);
}

.divider::after{
    content:"";
    position:absolute;
    right:0;
    top:50%;
    width:40%;
    height:1px;
    background:rgba(255,255,255,0.4);
}

.register-text{
    display:block;
    text-align:center;
    font-size:14px;
    color:azure;
    text-decoration:none;
}

.register-text:hover{
    color:red;
}

.error{
    text-align:center;
    color:#ffb3b3;
    margin-bottom:15px;
    font-size:14px;
}

@media(max-width:480px){

    .login-box{
        padding:25px;
    }

    h2{
        font-size:20px;
    }

    .subtitle{
        font-size:13px;
    }
}
</style>
</head>

<body>

<div id="page-loader">
    <div class="loader-animation"></div>
</div>

<div id="main-content">

<div class="container">

<form class="login-box" method="post" onsubmit="showLoader()">

    {% csrf_token %}

    <h2>Hello Students 👋</h2>

    <p class="subtitle">Login to Attend</p>

    {% if error %}
    <div class="error">
        {{ error }}
    </div>
    {% endif %}

    <div class="input-box">
        <input type="email" name="email" required>
        <label>Email Address</label>
    </div>

    <div class="input-box">
        <input type="password" name="password" required>
        <label>Password</label>
    </div>

    <div class="options">
        <label>
            <input type="checkbox">
            Remember me
        </label>
    </div>

    <button type="submit">
        Login
    </button>

    <div class="divider">
        OR
    </div>

    <a href="/accounts/google/login/?process=login" class="google-btn">

        <svg class="google-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
            <path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3 0 5.7 1.1 7.8 3l5.7-5.7C34.1 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.3-.4-3.5z"/>
            <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 16 19 12 24 12c3 0 5.7 1.1 7.8 3l5.7-5.7C34.1 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/>
            <path fill="#4CAF50" d="M24 44c5.2 0 10-2 13.5-5.3l-6.2-5.2c-2.1 1.6-4.6 2.5-7.3 2.5-5.3 0-9.8-3.3-11.4-8l-6.5 5C9.5 39.5 16.2 44 24 44z"/>
            <path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-1.1 3-3.3 5.3-6 6.8l.1-.1 6.2 5.2C35.2 39.2 44 33 44 24c0-1.3-.1-2.3-.4-3.5z"/>
        </svg>

        Continue with Google

    </a>

    <a href="/admin-dashboard/" class="register-text">
        ← Admin Panel
    </a>

</form>

</div>

</div>

<script>

window.addEventListener("load",function(){

    setTimeout(function(){

        document.getElementById("page-loader").style.display="none";
        document.getElementById("main-content").style.display="flex";

    },2000);

});

function showLoader(){
    document.getElementById("page-loader").style.display="flex";
}

</script>

</body>
</html>
