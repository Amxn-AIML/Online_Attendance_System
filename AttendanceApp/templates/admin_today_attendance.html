<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Today's Attendance</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:"Segoe UI",sans-serif;
}

body{
  background:linear-gradient(135deg,#eef2ff,#f8fafc);
  padding:30px;
}

#page-loader{
  position:fixed;
  width:100%;
  height:100vh;
  background:#0f172a;
  display:flex;
  justify-content:center;
  align-items:center;
  z-index:99999;
  top:0;
  left:0;
}

.loader-animation{
  width:65px;
  aspect-ratio:1;
  position:relative;
}

.loader-animation:before,
.loader-animation:after{
  content:"";
  position:absolute;
  border-radius:50px;
  box-shadow:0 0 0 3px inset #fff;
  animation:l4 2.5s infinite;
}

.loader-animation:after{
  animation-delay:-1.25s;
}

@keyframes l4{
  0%{
    inset:0 35px 35px 0;
  }
  12.5%{
    inset:0 35px 0 0;
  }
  25%{
    inset:35px 35px 0 0;
  }
  37.5%{
    inset:35px 0 0 0;
  }
  50%{
    inset:35px 0 0 35px;
  }
  62.5%{
    inset:0 0 0 35px;
  }
  75%{
    inset:0 0 35px 35px;
  }
  87.5%{
    inset:0 0 35px 0;
  }
  100%{
    inset:0 35px 35px 0;
  }
}

#main-content{
  display:none;
}

.header{
  background:white;
  padding:22px 26px;
  border-radius:18px;
  box-shadow:0 12px 35px rgba(0,0,0,.08);
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:30px;
  gap:15px;
  flex-wrap:wrap;
}

.header h2{
  color:#1f2937;
  font-size:22px;
}

.header .actions{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

.btn{
  padding:10px 18px;
  border-radius:10px;
  text-decoration:none;
  font-weight:600;
  font-size:14px;
  display:inline-block;
  text-align:center;
}

.btn-back{
  background:#4f46e5;
  color:white;
}

.btn-clear{
  background:#ef4444;
  color:white;
}

.table-box{
  background:white;
  border-radius:20px;
  box-shadow:0 16px 45px rgba(0,0,0,.08);
  overflow-x:auto;
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:600px;
}

table th, table td{
  padding:14px;
  border-bottom:1px solid #e5e7eb;
  font-size:14px;
  text-align:left;
  white-space:nowrap;
}

table th{
  background:#eef2ff;
  color:#3730a3;
}

.status-present{
  color:#16a34a;
  font-weight:700;
}

.status-rejected{
  color:#dc2626;
  font-weight:700;
}

.empty{
  text-align:center;
  padding:30px;
  color:#6b7280;
  font-size:15px;
}

@media(max-width:768px){
  body{
    padding:15px;
  }
  .header{
    flex-direction:column;
    align-items:flex-start;
  }
  .header .actions{
    width:100%;
  }
  .btn{
    flex:1 1 100%;
  }
}
</style>
</head>

<body>

<div id="page-loader">
  <div class="loader-animation"></div>
</div>

<div id="main-content">

<div class="header">
  <h2>Today's Attendance</h2>

  <div class="actions">

    <a href="/clear-today-attendance/"
       class="btn btn-clear"
       onclick="showLoader(); return confirm('Are you sure you want to clear today attendance?')">
       Clear Today
    </a>

    <a href="/admin-dashboard/" class="btn btn-back" onclick="showLoader()">
       Back to Dashboard
    </a>

  </div>
</div>

<div class="table-box">
  <table>
    <tr>
      <th>Student Name</th>
      <th>Roll Number</th>
      <th>Time</th>
      <th>Status</th>
    </tr>

    {% if attendance %}
      {% for a in attendance %}
      <tr>
        <td>{{ a.student.name }}</td>
        <td>{{ a.student.roll }}</td>
        <td>{{ a.time }}</td>
        <td class="{% if a.status == 'PRESENT' %}status-present{% else %}status-rejected{% endif %}">
          {{ a.status }}
        </td>
      </tr>
      {% endfor %}
    {% else %}
      <tr>
        <td colspan="4" class="empty">
          No attendance marked today
        </td>
      </tr>
    {% endif %}
  </table>
</div>

</div>

<script>

window.addEventListener("load",function(){

  setTimeout(function(){

    document.getElementById("page-loader").style.display="none";
    document.getElementById("main-content").style.display="block";

  },1000);

});

function showLoader(){
  document.getElementById("page-loader").style.display="flex";
}

</script>

</body>
</html>
